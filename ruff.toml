line-length = 88
target-version = "py311"
extend-exclude = ["docs"]

[lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP017", "B008"]

[lint.isort]
known-first-party = [
    "agent",
    "api",
    "clients",
    "core",
    "domain",
    "models",
    "observability",
    "persistence",
    "security",
    "tools",
]

[format]
quote-style = "double"
indent-style = "space"
