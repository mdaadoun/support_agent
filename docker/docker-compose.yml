version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: support_agent_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPPORT_AGENT_ENV=production
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEFAULT_TENANT_ID=default_tenant
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DSN=postgresql://support_user:support_pass@postgres:5432/support_agent_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - support_network

  redis:
    image: redis:7-alpine
    container_name: support_agent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - support_network

  postgres:
    image: postgres:15-alpine
    container_name: support_agent_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_pass
      POSTGRES_DB: support_agent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_agent_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - support_network

networks:
  support_network:
    driver: bridge

volumes:
  postgres_data:
